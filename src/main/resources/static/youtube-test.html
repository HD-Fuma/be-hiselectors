<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유튜브 채널 인증 테스트</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
        h1 { font-size: 1.4rem; }
        section { border: 1px solid #e3e3e3; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        label { display: block; font-size: .85rem; color: #555; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px; }
        button { padding: 10px 18px; border: 0; border-radius: 6px; cursor: pointer; font-size: .95rem; }
        .primary { background: #ff0000; color: #fff; }
        .secondary { background: #222; color: #fff; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .muted { color: #888; font-size: .8rem; }
        .ok { color: #128a12; }
        .err { color: #c62828; }
        #tokenState { font-size: .85rem; margin-top: 8px; }
        pre { background: #f6f6f6; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: .8rem; }
    </style>
</head>
<body>
    <h1>유튜브 채널 소유 인증 테스트</h1>

    <!-- 결과: 콜백에서 이 페이지로 리다이렉트될 때 표시 -->
    <section id="resultSection" style="display:none;">
        <strong>인증 결과</strong>
        <p id="resultMsg"></p>
    </section>

    <!-- 1) 로그인해서 JWT 발급 -->
    <section>
        <strong>1. 로그인 (JWT 발급)</strong>
        <p class="muted">유저 계정으로 로그인해서 액세스 토큰을 받습니다.</p>
        <label for="loginId">아이디 (hi_id)</label>
        <input id="loginId" type="text" autocomplete="username">
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password">
        <button class="secondary" onclick="login()">로그인</button>
        <div id="tokenState" class="muted">토큰 없음</div>
    </section>

    <!-- 2) 유튜브 인증 시작 -->
    <section>
        <strong>2. 유튜브 채널 인증</strong>
        <p class="muted">버튼을 누르면 구글 로그인/동의 화면으로 이동합니다.</p>
        <button id="ytBtn" class="primary" onclick="connectYoutube()" disabled>내 유튜브 채널 인증하기</button>
    </section>

    <script>
        const TOKEN_KEY = 'hi_access_token';

        // --- 페이지 로드 시: 콜백 결과 표시 + 저장된 토큰 복원 ---
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(location.search);
            const status = params.get('youtube');
            if (status) {
                const box = document.getElementById('resultSection');
                const msg = document.getElementById('resultMsg');
                box.style.display = 'block';
                if (status === 'success') {
                    const channel = params.get('channel') || '(채널명 없음)';
                    msg.innerHTML = '<span class="ok">✅ 인증 성공!</span> 연동된 채널: <b>' + escapeHtml(channel) + '</b>';
                } else {
                    const reason = params.get('reason') || 'unknown';
                    msg.innerHTML = '<span class="err">❌ 인증 실패</span> — 사유: <code>' + escapeHtml(reason) + '</code>';
                }
                // 쿼리스트링 정리 (새로고침 시 결과 반복 표시 방지)
                history.replaceState(null, '', location.pathname);
            }
            restoreToken();
        });

        function restoreToken() {
            const token = sessionStorage.getItem(TOKEN_KEY);
            const state = document.getElementById('tokenState');
            const btn = document.getElementById('ytBtn');
            if (token) {
                state.textContent = '토큰 있음 (인증 가능)';
                state.className = 'ok';
                btn.disabled = false;
            } else {
                state.textContent = '토큰 없음 (먼저 로그인하세요)';
                state.className = 'muted';
                btn.disabled = true;
            }
        }

        async function login() {
            const loginId = document.getElementById('loginId').value.trim();
            const password = document.getElementById('password').value;
            if (!loginId || !password) { alert('아이디/비밀번호를 입력하세요.'); return; }
            try {
                const res = await fetch('/api/auth/user/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ loginId, password })
                });
                if (!res.ok) { alert('로그인 실패 (' + res.status + ')'); return; }
                const data = await res.json();
                sessionStorage.setItem(TOKEN_KEY, data.accessToken);
                restoreToken();
            } catch (e) {
                alert('로그인 요청 오류: ' + e.message);
            }
        }

        async function connectYoutube() {
            const token = sessionStorage.getItem(TOKEN_KEY);
            if (!token) { alert('먼저 로그인하세요.'); return; }
            try {
                const res = await fetch('/api/youtube/oauth/authorize', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) { alert('인증 URL 발급 실패 (' + res.status + ')'); return; }
                const data = await res.json();
                // 구글 동의 화면으로 이동
                location.href = data.authorizationUrl;
            } catch (e) {
                alert('요청 오류: ' + e.message);
            }
        }

        function escapeHtml(s) {
            return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
        }
    </script>
</body>
</html>
