<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>카카오 메시지 테스트</title>
  <style>
    body{font-family:sans-serif;max-width:900px;margin:32px auto;padding:0 16px;background:#f7f7f7}section{background:white;padding:20px;margin:16px 0;border-radius:10px}input,select,button,textarea{padding:9px;margin:4px;max-width:100%;box-sizing:border-box}textarea{width:100%;height:70px}button{cursor:pointer}pre{white-space:pre-wrap;background:#222;color:#eee;padding:12px;border-radius:6px}.friend{display:block;margin:6px}
  </style>
</head>
<body>
<h1>카카오 메시지 테스트</h1>
<p>교육·시연용 카카오톡 메시지 API이며 알림톡이 아닙니다.</p>
<section><h2>JWT</h2><label>관리자 JWT<textarea id="adminToken"></textarea></label><label>사용자 JWT<textarea id="userToken"></textarea></label><button onclick="saveTokens()">저장</button></section>
<section><h2>OAuth 연결</h2><button onclick="authorize('sender')">공용 발신 계정 연결</button><button onclick="authorize('recipient')">사용자 수신 계정 연결</button></section>
<section><h2>친구</h2><button onclick="friends()">친구 목록 조회</button><button onclick="syncFriends()">수신자 UUID 동기화</button><div id="friends"></div></section>
<section><h2>메시지</h2><label>유형 <select id="type"><option>SELECTION_APPROVED</option><option>SELECTION_REJECTED</option><option>CONTENT_EDIT_REQUEST</option><option>CONTENT_EDIT_DONE</option><option>DEAD_LINK_NOTICE</option><option>SETTLEMENT_MISSING</option><option>ACTIVITY_GUIDE</option></select></label><input id="receiverName" placeholder="수신자 이름"><input id="detail" placeholder="추가 안내"><button onclick="send('me')">나에게 보내기</button><button onclick="send('friend')">선택 친구에게 보내기</button></section>
<section><h2>결과</h2><pre id="result">대기 중</pre></section>
<script>
const $=id=>document.getElementById(id);let selectedUserId=null;
function saveTokens(){localStorage.adminToken=$('adminToken').value.trim();localStorage.userToken=$('userToken').value.trim();show('JWT 저장 완료')}
function load(){ $('adminToken').value=localStorage.adminToken||'';$('userToken').value=localStorage.userToken||'';const q=new URLSearchParams(location.search);if(q.get('code')&&q.get('state'))connect(q.get('code'),q.get('state'));}
async function api(url,opt={},kind='admin'){const token=kind==='user'?localStorage.userToken:localStorage.adminToken;const res=await fetch(url,{...opt,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...opt.headers}});const text=await res.text();let data;try{data=JSON.parse(text)}catch{data=text}if(!res.ok)throw data;return data}
async function authorize(kind){saveTokens();localStorage.kakaoMode=kind;try{const path=kind==='sender'?'/api/admin/kakao/oauth/authorize':'/api/kakao/oauth/authorize';const data=await api(path,{},kind==='sender'?'admin':'user');location.href=data.authorizationUrl}catch(e){show(e)}}
async function connect(code,state){const kind=localStorage.kakaoMode||'sender';try{const path=kind==='sender'?'/api/admin/kakao/oauth/connect':'/api/kakao/oauth/connect';const data=await api(path,{method:'POST',body:JSON.stringify({code,state})},kind==='sender'?'admin':'user');history.replaceState({},'',location.pathname);show(data)}catch(e){show(e)}}
async function friends(){try{const data=await api('/api/admin/test/kakao/friends');$('friends').innerHTML=data.map(f=>`<label class="friend"><input type="radio" name="friend" ${f.userId?'':'disabled'} onclick="selectedUserId=${f.userId}">${f.nickname||f.kakaoUserId} / userId=${f.userId||'미연결'}</label>`).join('');show(data)}catch(e){show(e)}}
async function syncFriends(){try{show(await api('/api/admin/test/kakao/friends/sync',{method:'POST'}));await friends()}catch(e){show(e)}}
async function send(target){if(target==='friend'&&!selectedUserId)return show('수신 연결된 친구를 선택하세요.');const body={userId:target==='friend'?selectedUserId:null,notificationType:$('type').value,referenceId:null,receiverName:$('receiverName').value,detail:$('detail').value};try{show(await api(`/api/admin/test/kakao/messages/${target}`,{method:'POST',body:JSON.stringify(body)}))}catch(e){show(e)}}
function show(v){$('result').textContent=typeof v==='string'?v:JSON.stringify(v,null,2)}load();
</script>
</body>
</html>
