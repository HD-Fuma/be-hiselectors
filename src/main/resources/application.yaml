server:
  port: ${PORT:8080}
  shutdown: graceful

scheduling:
  enabled: ${SCHEDULING_ENABLED:true}

spring:
  application:
    name: hiselectors

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_PHASE_TIMEOUT:25s}

  # 커스텀 JWT 인증을 쓰므로 스프링의 기본 인메모리 유저 자동설정을 끈다.
  # (안 끄면 "Using generated security password..." 경고가 매번 출력됨)
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # devtools 자동 재시작 끔. 코드 변경 때마다 컨텍스트가 재시작되면 자동 실행된 정성 엔진
  # 워커도 매번 재기동(모델 20초 재로딩)돼 느려진다. 재시작이 필요하면 이 값을 true 로.
  devtools:
    restart:
      enabled: false

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hiselectors}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 30000
      max-lifetime: 1500000
      connection-timeout: 10000
      leak-detection-threshold: 20000

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${FORMAT_SQL:true}
    open-in-view: false

  # 크리에이터 제안 메일 발송(Gmail SMTP). 앱 비밀번호를 MAIL_PASSWORD 로 주입한다.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

media:
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${MEDIA_S3_BUCKET:}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
  local:
    directory: ${MEDIA_LOCAL_DIRECTORY:./.local-media}
    public-base-url: ${MEDIA_LOCAL_PUBLIC_BASE_URL:http://127.0.0.1:${server.port}/media}

# 액추에이터 헬스체크가 매번 SMTP 연결을 시도해 실패 로그를 남기지 않도록 끈다.
# (실제 발송은 제안 API 호출 시에만 일어난다.)
management:
  health:
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health, scheduledtasks

task-queue:
  enabled: ${TASK_QUEUE_ENABLED:false}
  worker-enabled: ${TASK_QUEUE_WORKER_ENABLED:false}
  url: ${TASK_QUEUE_URL:}
  dlq-url: ${TASK_QUEUE_DLQ_URL:}
  region: ${AWS_REGION:ap-northeast-2}
  concurrency: ${TASK_QUEUE_CONCURRENCY:1}
  visibility-seconds: ${TASK_QUEUE_VISIBILITY_SECONDS:300}
  lease-seconds: ${TASK_QUEUE_LEASE_SECONDS:120}
  heartbeat-seconds: ${TASK_QUEUE_HEARTBEAT_SECONDS:30}
  max-attempts: ${TASK_QUEUE_MAX_ATTEMPTS:3}
  retry-delay-seconds: ${TASK_QUEUE_RETRY_DELAY_SECONDS:30}
  resend-after-seconds: ${TASK_QUEUE_RESEND_AFTER_SECONDS:600}

task-run:
  executor:
    core-size: ${TASK_RUN_CORE_SIZE:2}
    max-size: ${TASK_RUN_MAX_SIZE:4}
    queue-capacity: ${TASK_RUN_QUEUE_CAPACITY:20}
    thread-prefix: ${TASK_RUN_THREAD_PREFIX:task-run-}
  progress:
    flush-count: ${TASK_RUN_PROGRESS_FLUSH_COUNT:10}
    flush-interval-ms: ${TASK_RUN_PROGRESS_FLUSH_INTERVAL_MS:2000}
  stale:
    fixed-delay: ${TASK_RUN_STALE_FIXED_DELAY_MS:60000}
    timeouts:
      creator-sync: ${TASK_RUN_CREATOR_SYNC_STALE_TIMEOUT:30m}
      content-sync: ${TASK_RUN_CONTENT_SYNC_STALE_TIMEOUT:30m}
      application-report-generation: ${TASK_RUN_APPLICATION_REPORT_STALE_TIMEOUT:120m}
      content-report-generation: ${TASK_RUN_CONTENT_REPORT_STALE_TIMEOUT:120m}
      settlement-calculation: ${TASK_RUN_SETTLEMENT_STALE_TIMEOUT:30m}
      kakao-message-send: ${TASK_RUN_KAKAO_MESSAGE_STALE_TIMEOUT:10m}
      proposal-email-send: ${TASK_RUN_PROPOSAL_EMAIL_STALE_TIMEOUT:10m}
      selector-proposal-email-send: ${TASK_RUN_SELECTOR_PROPOSAL_EMAIL_STALE_TIMEOUT:10m}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: ${JWT_EXPIRE_SECONDS:86400}

youtube:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${YOUTUBE_REDIRECT_URI:http://localhost:3000/youtube/callback}
    scope: https://www.googleapis.com/auth/youtube.readonly

  # 발굴용. OAuth 와 달리 사용자 동의 없이 공개 채널을 검색하므로 API 키를 쓴다.
  discovery:
    api-key: ${youtube.collection.api-key}
    daily-quota: ${youtube.collection.daily-quota}
    max-results-per-keyword: ${youtube.collection.max-results-per-keyword}
    batch:
      max-keywords-per-run: ${youtube.collection.batch.max-keywords-per-run}

  collection:
    api-key: ${YOUTUBE_API_KEY:}
    daily-quota: ${YOUTUBE_DISCOVERY_DAILY_QUOTA:10000}
    max-results-per-keyword: ${YOUTUBE_DISCOVERY_MAX_RESULTS:25}
    batch:
      max-keywords-per-run: ${YOUTUBE_DISCOVERY_MAX_KEYWORDS:50}

# 더현대Hi 카테고리 스냅샷을 발굴 기본값으로 사용한다.
# 기존 관리자 카테고리·키워드 설정은 덮어쓰지 않는다.
discovery:
  defaults:
    enabled: ${DISCOVERY_DEFAULTS_ENABLED:true}

gemini:
  api-key: ${GEMINI_API_KEY:}
  api-keys: ${GEMINI_API_KEYS:}
  fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-3.6-flash}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:65536}

# Instagram STT/OCR 파이썬 워커 (faster-whisper + RapidOCR)
stt:
  worker:
    base-url: ${STT_WORKER_BASE_URL:http://127.0.0.1:8900}

content-inspection:
  analysis:
    api-key: ${CONTENT_INSPECTION_GEMINI_API_KEY:${GEMINI_API_KEY:${gemini.api-key:}}}
    api-keys: ${CONTENT_INSPECTION_GEMINI_API_KEYS:${GEMINI_API_KEYS:${gemini.api-keys:}}}
    model: ${CONTENT_INSPECTION_ANALYSIS_MODEL:gemini-3.5-flash-lite}
    fallback-models: ${CONTENT_INSPECTION_ANALYSIS_FALLBACK_MODELS:gemini-3.6-flash}
    max-output-tokens: ${CONTENT_INSPECTION_ANALYSIS_MAX_OUTPUT_TOKENS:8192}
  extraction:
    youtube:
      api-key: ${CONTENT_INSPECTION_GEMINI_API_KEY:${GEMINI_API_KEY:${gemini.api-key:}}}
      api-keys: ${CONTENT_INSPECTION_GEMINI_API_KEYS:${GEMINI_API_KEYS:${gemini.api-keys:}}}
      model: ${CONTENT_INSPECTION_EXTRACTION_MODEL:gemini-3.6-flash}
      fallback-models: ${CONTENT_INSPECTION_EXTRACTION_FALLBACK_MODELS:}
      max-output-tokens: ${CONTENT_INSPECTION_EXTRACTION_MAX_OUTPUT_TOKENS:32768}
      api-version: ${CONTENT_INSPECTION_INTERACTIONS_API_VERSION:v1beta}
    instagram:
      worker-base-url: ${CONTENT_INSPECTION_STT_WORKER_BASE_URL:${STT_WORKER_BASE_URL:http://127.0.0.1:8900}}
      # 콘텐츠 전용 /content/reel 및 SageMaker 모델 식별자다.
      stt-model: ${INSTAGRAM_STT_MODEL:whisper-large-v3-structured-20260829-112443}
      ocr-model: ${INSTAGRAM_OCR_MODEL:rapidocr-ppocrv4-ko-mobile}

inspection:
  policy-sync:
    enabled: ${INSPECTION_POLICY_SYNC_ENABLED:true}

instagram:
  oauth:
    client-id: ${INSTAGRAM_CLIENT_ID:}
    client-secret: ${INSTAGRAM_CLIENT_SECRET:}
    redirect-uri: ${INSTAGRAM_REDIRECT_URI:https://hiselectors.shop/}
    scope: instagram_business_basic

  collection:
    api-version: ${META_API_VERSION:v24.0}
    business-account-id: ${META_INSTAGRAM_BUSINESS_ACCOUNT_ID:}
    access-token: ${META_LONG_LIVED_ACCESS_TOKEN:}

# OAuth CSRF state 유효시간 (유튜브, 인스타 공용)
oauth:
  state-validity-seconds: 300

kakao:
  oauth:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:https://hiselectors.shop/mypage/member}
    sender-scope: friends,talk_message,profile_nickname
    recipient-scope: friends,talk_message
  message:
    web-url: ${KAKAO_MESSAGE_WEB_URL:https://hiselectors.shop/}
    mobile-web-url: ${KAKAO_MESSAGE_MOBILE_WEB_URL:https://hiselectors.shop/}
    image-url: ${KAKAO_MESSAGE_IMAGE_URL:https://developers.kakao.com/assets/img/about/logos/kakaolink/kakaolink_btn_medium.png}
    default-recipient-uuid: ${KAKAO_MESSAGE_DEFAULT_RECIPIENT_UUID:}
  token-encryption-key: ${KAKAO_TOKEN_ENCRYPTION_KEY:}

purchase:
  auto-confirm:
    cron: ${PURCHASE_AUTO_CONFIRM_CRON:0 5 0 * * *}

performance:
  notification:
    sender-admin-login-id: ${PERFORMANCE_NOTIFICATION_SENDER_ADMIN_LOGIN_ID:}
    daily-cron: ${PERFORMANCE_NOTIFICATION_DAILY_CRON:0 0 9 * * *}
    zone: ${PERFORMANCE_NOTIFICATION_ZONE:Asia/Seoul}

proposal:
  mail:
    admin-position: ${PROPOSAL_ADMIN_POSITION:매니저}
    admin-email: ${PROPOSAL_ADMIN_EMAIL:official@hiselectors.shop}
    apply-url: ${PROPOSAL_APPLY_URL:https://hiselectors.shop/apply}

selectors:
  lifecycle:
    # 기존 기수의 실제 활동 기간을 보정한 뒤 활성화한다.
    enabled: ${SELECTORS_LIFECYCLE_ENABLED:false}
    cron: ${SELECTORS_LIFECYCLE_CRON:0 15 0 * * *}
    zone: ${SELECTORS_LIFECYCLE_ZONE:Asia/Seoul}
  sns-enrichment:
    # 지원서 없이 셀렉터스 프로필 이미지·카테고리만 채운다. 기본 꺼 두어 운영 API 비용을 막는다.
    scheduler-enabled: ${SELECTORS_SNS_ENRICHMENT_SCHEDULER_ENABLED:false}
    fixed-delay-ms: ${SELECTORS_SNS_ENRICHMENT_FIXED_DELAY_MS:60000}
    initial-delay-ms: ${SELECTORS_SNS_ENRICHMENT_INITIAL_DELAY_MS:15000}
    batch-size: ${SELECTORS_SNS_ENRICHMENT_BATCH_SIZE:5}
  excellence:
    enabled: ${SELECTORS_EXCELLENCE_ENABLED:true}
    cron: ${SELECTORS_EXCELLENCE_CRON:0 20 0 * * *}
    zone: ${SELECTORS_EXCELLENCE_ZONE:Asia/Seoul}
    grace-days: ${SELECTORS_EXCELLENCE_GRACE_DAYS:7}

content:
  batch:
    cron: ${CONTENT_BATCH_CRON:-}
    zone: ${CONTENT_BATCH_ZONE:Asia/Seoul}

application:
  media-collection:
    fixed-delay-ms: ${APPLICATION_MEDIA_COLLECTION_FIXED_DELAY_MS:600000}
    initial-delay-ms: ${APPLICATION_MEDIA_COLLECTION_INITIAL_DELAY_MS:200000}
    batch-size: ${APPLICATION_MEDIA_COLLECTION_BATCH_SIZE:20}
  content-analysis:
    scheduler-enabled: ${APPLICATION_CONTENT_ANALYSIS_SCHEDULER_ENABLED:true}
    run-once: ${APPLICATION_CONTENT_ANALYSIS_RUN_ONCE:false}
    # run-once Fargate 태스크 1개가 이 수만큼 순차 처리하고 종료. 대량 백로그(테스트 볼륨 등) 드레인 시 상향.
    batch-size: ${APPLICATION_CONTENT_ANALYSIS_BATCH_SIZE:10}
settlement:
  account-encryption-key: ${SETTLEMENT_ACCOUNT_ENCRYPTION_KEY:}
  zone: ${SETTLEMENT_ZONE:Asia/Seoul}
  estimate:
    cron: ${SETTLEMENT_ESTIMATE_CRON:0 0 3 * * *}
  finalization:
    cron: ${SETTLEMENT_FINALIZATION_CRON:0 0 0 * * *}
  payment:
    cron: ${SETTLEMENT_PAYMENT_CRON:0 0 0 * * *}
    minimum-amount: ${SETTLEMENT_PAYMENT_MINIMUM_AMOUNT:1000}
  expiry:
    cron: ${SETTLEMENT_EXPIRY_CRON:0 0 0 1 * *}
  notification:
    sender-admin-login-id: ${SETTLEMENT_NOTIFICATION_SENDER_ADMIN_LOGIN_ID:}
    upcoming-cron: ${SETTLEMENT_NOTIFICATION_UPCOMING_CRON:0 0 9 * * *}
