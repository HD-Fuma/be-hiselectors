spring:
  application:
    name: hiselectors

  # 커스텀 JWT 인증을 쓰므로 스프링의 기본 인메모리 유저 자동설정을 끈다.
  # (안 끄면 "Using generated security password..." 경고가 매번 출력됨)
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hiselectors}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: ${JWT_EXPIRE_SECONDS:3600}

youtube:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${YOUTUBE_REDIRECT_URI:http://localhost:3000/youtube/callback}
    scope: https://www.googleapis.com/auth/youtube.readonly
    state-validity-seconds: 300

instagram:
  oauth:
    client-id: ${INSTAGRAM_CLIENT_ID:}
    client-secret: ${INSTAGRAM_CLIENT_SECRET:}
    redirect-uri: ${INSTAGRAM_REDIRECT_URI:http://localhost:3000/instagram/callback}
    scope: instagram_business_basic
    state-validity-seconds: 300
