server:
  port: ${PORT:8080}

spring:
  application:
    name: hiselectors

  # 커스텀 JWT 인증을 쓰므로 스프링의 기본 인메모리 유저 자동설정을 끈다.
  # (안 끄면 "Using generated security password..." 경고가 매번 출력됨)
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hiselectors}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: ${JWT_EXPIRE_SECONDS:3600}

youtube:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${YOUTUBE_REDIRECT_URI:http://localhost:3000/youtube/callback}
    scope: https://www.googleapis.com/auth/youtube.readonly

  # 발굴용. OAuth 와 달리 사용자 동의 없이 공개 채널을 검색하므로 API 키를 쓴다.
  discovery:
    api-key: ${YOUTUBE_API_KEY:}
    daily-quota: ${YOUTUBE_DISCOVERY_DAILY_QUOTA:10000}
    max-results-per-keyword: ${YOUTUBE_DISCOVERY_MAX_RESULTS:25}
    scheduler:
      # 로컬 실행 중 실제 API 쿼터가 소모되지 않도록 명시적으로 켜야 동작한다.
      enabled: ${YOUTUBE_DISCOVERY_SCHEDULER_ENABLED:false}
      cron: "${YOUTUBE_DISCOVERY_SCHEDULER_CRON:0 0 2 * * *}"
      zone: ${YOUTUBE_DISCOVERY_SCHEDULER_ZONE:Asia/Seoul}
      max-keywords-per-run: ${YOUTUBE_DISCOVERY_MAX_KEYWORDS:50}

instagram:
  oauth:
    client-id: ${INSTAGRAM_CLIENT_ID:}
    client-secret: ${INSTAGRAM_CLIENT_SECRET:}
    redirect-uri: ${INSTAGRAM_REDIRECT_URI}
    scope: instagram_business_basic

# OAuth CSRF state 유효시간 (유튜브, 인스타 공용)
oauth:
  state-validity-seconds: 300
