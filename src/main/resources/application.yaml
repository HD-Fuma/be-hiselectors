server:
  port: ${PORT:8080}

spring:
  application:
    name: hiselectors

  # 커스텀 JWT 인증을 쓰므로 스프링의 기본 인메모리 유저 자동설정을 끈다.
  # (안 끄면 "Using generated security password..." 경고가 매번 출력됨)
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hiselectors}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 30000
      max-lifetime: 1500000
      connection-timeout: 10000
      leak-detection-threshold: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: ${JWT_EXPIRE_SECONDS:3600}

youtube:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${YOUTUBE_REDIRECT_URI:http://localhost:3000/youtube/callback}
    scope: https://www.googleapis.com/auth/youtube.readonly

  # 발굴용. OAuth 와 달리 사용자 동의 없이 공개 채널을 검색하므로 API 키를 쓴다.
  discovery:
    api-key: ${YOUTUBE_API_KEY:}
    daily-quota: ${YOUTUBE_DISCOVERY_DAILY_QUOTA:10000}
    max-results-per-keyword: ${YOUTUBE_DISCOVERY_MAX_RESULTS:25}
    batch:
      max-keywords-per-run: ${YOUTUBE_DISCOVERY_MAX_KEYWORDS:50}

# 더현대Hi 카테고리 스냅샷을 발굴 기본값으로 사용한다.
# 기존 관리자 카테고리·키워드 설정은 덮어쓰지 않는다.
discovery:
  defaults:
    enabled: ${DISCOVERY_DEFAULTS_ENABLED:true}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}

instagram:
  oauth:
    client-id: ${INSTAGRAM_CLIENT_ID:}
    client-secret: ${INSTAGRAM_CLIENT_SECRET:}
    redirect-uri: ${INSTAGRAM_REDIRECT_URI}
    scope: instagram_business_basic

# OAuth CSRF state 유효시간 (유튜브, 인스타 공용)
oauth:
  state-validity-seconds: 300

kakao:
  oauth:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/kakao-test}
    sender-scope: friends,talk_message,profile_nickname
    recipient-scope: friends,talk_message
  message:
    web-url: ${KAKAO_MESSAGE_WEB_URL:http://localhost:3000}
    mobile-web-url: ${KAKAO_MESSAGE_MOBILE_WEB_URL:http://localhost:3000}
    image-url: ${KAKAO_MESSAGE_IMAGE_URL:https://developers.kakao.com/assets/img/about/logos/kakaolink/kakaolink_btn_medium.png}
  token-encryption-key: ${KAKAO_TOKEN_ENCRYPTION_KEY:}
