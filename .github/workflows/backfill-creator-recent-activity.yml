name: Backfill creator recent activity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REMOTE_SCRIPT: |
        set -eu
        cd /srv/hiselectors
        API_CONTAINER="$(docker compose ps -q api)"
        test -n "$API_CONTAINER"
        test "$(docker inspect --format '{{.State.Running}}' "$API_CONTAINER")" = "true"

        container_env() {
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$API_CONTAINER" |
            sed -n "s/^$1=//p" |
            head -n 1
        }

        DB_HOST="$(container_env DB_HOST)"
        DB_PORT="$(container_env DB_PORT)"
        DB_NAME="$(container_env DB_NAME)"
        DB_USERNAME="$(container_env DB_USERNAME)"
        DB_PASSWORD="$(container_env DB_PASSWORD)"
        DB_PORT="${DB_PORT:-3306}"
        DB_NAME="${DB_NAME:-hiselectors}"
        DB_USERNAME="${DB_USERNAME:-root}"
        test -n "$DB_HOST"
        test -n "$(container_env YOUTUBE_API_KEY)"

        export MYSQL_PWD="$DB_PASSWORD"
        mysql_query() {
          docker run --rm --network "container:$API_CONTAINER" -e MYSQL_PWD mysql:8.4 \
            mysql --connect-timeout=10 -h "$DB_HOST" -P "$DB_PORT" \
            -u "$DB_USERNAME" "$DB_NAME" -Nse "$1"
        }

        NULL_COUNT_SQL="SELECT COUNT(*) FROM creator_pool c JOIN creator_discovery_info i ON i.creator_pool_id = c.creator_pool_id WHERE c.sns_code = 'YOUTUBE' AND c.is_deleted = 0 AND i.recent_90_day_content_count IS NULL"
        MISSING_INFO_COUNT_SQL="SELECT COUNT(*) FROM creator_pool c LEFT JOIN creator_discovery_info i ON i.creator_pool_id = c.creator_pool_id WHERE c.sns_code = 'YOUTUBE' AND c.is_deleted = 0 AND i.creator_pool_id IS NULL"

        null_before="$(mysql_query "$NULL_COUNT_SQL")"
        missing_info_before="$(mysql_query "$MISSING_INFO_COUNT_SQL")"
        echo "creator-recent-activity.before-null=$null_before"
        echo "creator-recent-activity.before-missing-info=$missing_info_before"
        test "$missing_info_before" = "0"

        BACKFILL_LOG="$(mktemp)"
        trap 'rm -f "$BACKFILL_LOG"' EXIT
        backfill_status=0
        docker compose run --rm --no-deps -T \
          -e CREATOR_RECENT_ACTIVITY_BACKFILL_ENABLED=true \
          -e SCHEDULING_ENABLED=false \
          -e DISCOVERY_DEFAULTS_ENABLED=false \
          api >"$BACKFILL_LOG" 2>&1 || backfill_status=$?
        grep 'creator-recent-activity-backfill=' "$BACKFILL_LOG" || true
        if [ "$backfill_status" -ne 0 ]; then
          echo "creator-recent-activity-backfill=failed" >&2
          exit "$backfill_status"
        fi

        null_after="$(mysql_query "$NULL_COUNT_SQL")"
        missing_info_after="$(mysql_query "$MISSING_INFO_COUNT_SQL")"
        echo "creator-recent-activity.after-null=$null_after"
        echo "creator-recent-activity.after-missing-info=$missing_info_after"
        test "$null_after" = "0"
        test "$missing_info_after" = "$missing_info_before"
        echo "creator-recent-activity-backfill=verified"
    steps:
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Backfill through SSM
        run: |
          test -n "$EC2_INSTANCE_ID"
          PARAMETERS="$(jq -cn --arg command "$REMOTE_SCRIPT" '{commands:[$command],executionTimeout:["1800"]}')"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)"
          STATUS=
          for _ in {1..360}; do
            STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
                exit 1
                ;;
            esac
            sleep 5
          done
          if [ "$STATUS" != "Success" ]; then
            aws ssm cancel-command --command-id "$COMMAND_ID" --instance-ids "$EC2_INSTANCE_ID"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' || true
            exit 1
          fi
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}'
