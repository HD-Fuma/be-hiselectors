name: Diagnose application content analysis schema

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REMOTE_SCRIPT: |
        set -eu
        cd /srv/hiselectors
        API_CONTAINER="$(docker compose ps -q api)"
        test -n "$API_CONTAINER"
        test "$(docker inspect --format '{{.State.Running}}' "$API_CONTAINER")" = "true"

        container_env() {
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$API_CONTAINER" |
            sed -n "s/^$1=//p" |
            head -n 1
        }

        DB_HOST="$(container_env DB_HOST)"
        DB_PORT="$(container_env DB_PORT)"
        DB_NAME="$(container_env DB_NAME)"
        DB_USERNAME="$(container_env DB_USERNAME)"
        DB_PASSWORD="$(container_env DB_PASSWORD)"
        DB_PORT="${DB_PORT:-3306}"
        DB_NAME="${DB_NAME:-hiselectors}"
        DB_USERNAME="${DB_USERNAME:-root}"
        test -n "$DB_HOST"

        export MYSQL_PWD="$DB_PASSWORD"
        mysql_query() {
          docker run --rm --pull never --network "container:$API_CONTAINER" \
            -e MYSQL_PWD mysql:8.4 mysql --connect-timeout=10 \
            -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USERNAME" "$DB_NAME" \
            -Nse "$1" 2>/dev/null
        }
        print_query() {
          value="$(mysql_query "$2")" || {
            echo "aca.$1=QUERY_FAILED"
            return 1
          }
          echo "aca.$1=$value"
        }

        print_query table_count "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name = 'application_content_analysis'"
        print_query column_count "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = 'application_content_analysis'"
        print_query valid_column_count "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = 'application_content_analysis' AND ((column_name = 'content_analysis_id' AND column_type = 'bigint' AND is_nullable = 'NO' AND extra = 'auto_increment') OR (column_name = 'applicant_id' AND column_type = 'bigint' AND is_nullable = 'NO') OR (column_name = 'content_key' AND column_type = 'varchar(200)' AND is_nullable = 'NO') OR (column_name = 'source' AND column_type = 'varchar(20)' AND is_nullable = 'YES') OR (column_name = 'stt' AND column_type = 'longtext' AND is_nullable = 'YES') OR (column_name = 'ocr' AND column_type = 'longtext' AND is_nullable = 'YES') OR (column_name = 'category' AND column_type = 'varchar(30)' AND is_nullable = 'YES') OR (column_name = 'keywords' AND column_type = 'longtext' AND is_nullable = 'YES') OR (column_name = 'hate_suspected' AND column_type = 'bit(1)' AND is_nullable = 'NO' AND column_default IN ('0', 'b''0''')) OR (column_name = 'created_at' AND column_type = 'datetime(6)' AND is_nullable = 'YES') OR (column_name = 'updated_at' AND column_type = 'datetime(6)' AND is_nullable = 'YES'))"
        print_query engine_collation "SELECT CONCAT(COALESCE(engine, 'NULL'), '/', COALESCE(table_collation, 'NULL')) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name = 'application_content_analysis'"
        print_query utf8mb4_string_count "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = 'application_content_analysis' AND column_name IN ('content_key', 'source', 'stt', 'ocr', 'category', 'keywords') AND character_set_name = 'utf8mb4'"
        print_query primary_key "SELECT GROUP_CONCAT(column_name ORDER BY ordinal_position) FROM information_schema.key_column_usage WHERE constraint_schema = DATABASE() AND table_name = 'application_content_analysis' AND constraint_name = 'PRIMARY'"
        print_query unique_index "SELECT GROUP_CONCAT(column_name ORDER BY seq_in_index) FROM information_schema.statistics WHERE table_schema = DATABASE() AND table_name = 'application_content_analysis' AND index_name = 'uq_aca_content_key' AND non_unique = 0 AND sub_part IS NULL"
        print_query unique_constraint_count "SELECT COUNT(*) FROM information_schema.table_constraints WHERE constraint_schema = DATABASE() AND table_name = 'application_content_analysis' AND constraint_name = 'uq_aca_content_key' AND constraint_type = 'UNIQUE'"
        print_query applicant_index "SELECT GROUP_CONCAT(column_name ORDER BY seq_in_index) FROM information_schema.statistics WHERE table_schema = DATABASE() AND table_name = 'application_content_analysis' AND index_name = 'idx_aca_applicant' AND non_unique = 1 AND sub_part IS NULL"
        print_query hate_default "SELECT CONCAT('hex:', COALESCE(HEX(column_default), 'NULL'), ',quoted:', COALESCE(QUOTE(column_default), 'NULL')) FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = 'application_content_analysis' AND column_name = 'hate_suspected'"
    steps:
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Diagnose schema through SSM
        run: |
          test -n "$EC2_INSTANCE_ID"
          PARAMETERS="$(jq -cn --arg command "$REMOTE_SCRIPT" '{commands:[$command],executionTimeout:["600"]}')"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)"
          STATUS=
          for _ in {1..120}; do
            STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
                exit 1
                ;;
            esac
            sleep 5
          done
          STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
          if [ "$STATUS" != "Success" ]; then
            aws ssm cancel-command --command-id "$COMMAND_ID" --instance-ids "$EC2_INSTANCE_ID"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' || true
            exit 1
          fi
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}'
