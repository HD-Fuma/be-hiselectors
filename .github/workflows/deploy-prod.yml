name: Deploy production

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 167595589232.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: be-hiselectors
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build application JAR
        run: ./gradlew bootJar --no-daemon

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push ARM64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy through SSM
        env:
          REMOTE_SCRIPT: |
            set -eu
            IMAGE_URI='${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
            aws ecr get-login-password --region '${{ env.AWS_REGION }}' | docker login --username AWS --password-stdin '${{ env.ECR_REGISTRY }}'
            docker pull "$IMAGE_URI"
            cd /srv/hiselectors
            # 장애 복구 배포도 진행할 수 있도록 기존 컨테이너의 health는 여기서 기다리지 않는다.
            docker compose up -d api
            OLD_API_CONTAINER="$(docker compose ps -q api)"
            test -n "$OLD_API_CONTAINER"
            OLD_IMAGE_ID="$(docker inspect --format '{{.Image}}' "$OLD_API_CONTAINER")"
            test -n "$OLD_IMAGE_ID"
            if [ -n "${ANALYSIS_QUEUE_URL:-}" ]; then
              sed -i '/^APPLICATION_CONTENT_ANALYSIS_QUEUE_URL=/d' .env
              printf 'APPLICATION_CONTENT_ANALYSIS_QUEUE_URL=%s\n' "$ANALYSIS_QUEUE_URL" >> .env
            fi
            sed -i '/^APPLICATION_CONTENT_ANALYSIS_SCHEDULER_ENABLED=/d' .env
            printf 'APPLICATION_CONTENT_ANALYSIS_SCHEDULER_ENABLED=false\n' >> .env

            DEPLOY_VERIFIED=false
            rollback() {
              status=$?
              trap - 0 1 2 15
              if [ "$DEPLOY_VERIFIED" != "true" ]; then
                echo "Deployment verification failed; restoring the previous API image" >&2
                docker tag "$OLD_IMAGE_ID" '${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest' || true
                docker compose up -d --force-recreate --wait --wait-timeout 180 api || true
              fi
              exit "$status"
            }
            trap rollback 0
            trap 'exit 129' 1
            trap 'exit 130' 2
            trap 'exit 143' 15

            docker compose stop -t 30 api
            docker tag "$IMAGE_URI" '${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest'
            docker compose up -d --force-recreate --wait --wait-timeout 180 api
            DEPLOY_VERIFIED=true
            trap - 0 1 2 15
            docker image prune -f
        run: |
          test -n "$EC2_INSTANCE_ID"
          ANALYSIS_QUEUE_URL="$(aws cloudformation describe-stacks \
            --stack-name hiselectors-analysis \
            --query "Stacks[0].Outputs[?OutputKey=='AnalysisQueueUrl'].OutputValue | [0]" \
            --output text 2>/dev/null || true)"
          [ "$ANALYSIS_QUEUE_URL" != "None" ] || ANALYSIS_QUEUE_URL=
          PARAMETERS="$(jq -cn \
            --arg queue_url "$ANALYSIS_QUEUE_URL" \
            --arg command "$REMOTE_SCRIPT" \
            '{commands:[("export ANALYSIS_QUEUE_URL=" + ($queue_url | @sh) + "\n" + $command)],executionTimeout:["1200"]}')"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)"
          STATUS=
          for _ in {1..270}; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
                exit 1
                ;;
            esac
            sleep 5
          done
          if [ "$STATUS" != "Success" ]; then
            aws ssm cancel-command --command-id "$COMMAND_ID" --instance-ids "$EC2_INSTANCE_ID"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" || true
            exit 1
          fi
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}'
