name: Deploy analysis worker

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing API image tag; blank uses this commit SHA
        required: false
      schedule_state:
        description: KEEP preserves the existing schedule; new stacks stay DISABLED
        required: true
        default: KEEP
        type: choice
        options: [KEEP, ENABLED, DISABLED]
  # ECS 또는 기존 메인 배포가 API 이미지(:$sha)를 올린 뒤 자동으로 워커도 배포한다.
  # 병렬 push 트리거는 이미지가 아직 없는 상태로 워커가 먼저 돌 수 있어, workflow_run 으로 체이닝.
  workflow_run:
    workflows: ["Deploy production to ECS (blue-green)", "Deploy production"]
    types: [completed]
    branches: [dev]

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-analysis
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 167595589232.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: be-hiselectors
  STACK_NAME: hiselectors-analysis
  # 수동 실행: inputs.image_tag(비면 이 커밋). 자동(workflow_run): 방금 배포된 커밋 SHA.
  IMAGE_TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 수동 실행이거나, 연결된 메인 배포가 성공한 경우에만.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 배포된 이미지와 같은 커밋의 템플릿을 쓰도록 SHA 를 명시적으로 체크아웃.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push ARM64 worker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: stt-worker
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}-worker

      - name: Deploy Fargate analysis stack
        env:
          SUBNET_IDS: ${{ vars.ANALYSIS_SUBNET_IDS }}
          SECURITY_GROUP_IDS: ${{ vars.ANALYSIS_SECURITY_GROUP_IDS }}
          RUNTIME_SECRET_ARN: ${{ secrets.ANALYSIS_RUNTIME_SECRET_ARN }}
          ASSIGN_PUBLIC_IP: ${{ vars.ANALYSIS_ASSIGN_PUBLIC_IP || 'DISABLED' }}
          SCHEDULE_STATE: ${{ inputs.schedule_state || 'KEEP' }}
        run: |
          set -euo pipefail
          test -n "$SUBNET_IDS"
          test -n "$SECURITY_GROUP_IDS"
          test -n "$RUNTIME_SECRET_ARN"
          parameters=(
            "ApiImageUri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            "WorkerImageUri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG-worker"
            "SubnetIds=$SUBNET_IDS"
            "SecurityGroupIds=$SECURITY_GROUP_IDS"
            "RuntimeSecretArn=$RUNTIME_SECRET_ARN"
            "AssignPublicIp=$ASSIGN_PUBLIC_IP"
          )
          # Omitted parameters retain existing values; first creation uses template defaults.
          case "$SCHEDULE_STATE" in
            KEEP) ;;
            ENABLED|DISABLED) parameters+=("ScheduleState=$SCHEDULE_STATE") ;;
            *) echo "Invalid schedule_state" >&2; exit 1 ;;
          esac
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/analysis-fargate/template.yaml \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides "${parameters[@]}"

      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' \
            --output table
