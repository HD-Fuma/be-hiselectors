  BatchWorkerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${AWS::StackName}-batch-worker'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref BatchWorkerTaskDefinition
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref BatchWorkerDesiredCount
      AvailabilityZoneRebalancing: DISABLED
      EnableECSManagedTags: true
      PropagateTags: TASK_DEFINITION
      HealthCheckGracePeriodSeconds: 180
      DeploymentController:
        Type: ECS
      DeploymentConfiguration:
        Strategy: ROLLING
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !GetAtt TaskSecurityGroup.GroupId
          Subnets:
            - !Ref PublicSubnetAId
            - !Ref PublicSubnetBId

  BatchWorkerLiveTaskCountLowAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: BatchWorkerServiceEnabled
    Properties:
      AlarmDescription: Batch worker task count stayed below its desired count
      Namespace: AWS/ECS
      MetricName: LiveTaskCount
      Dimensions:
        - Name: ClusterName
          Value: !Ref Cluster
        - Name: ServiceName
          Value: !GetAtt BatchWorkerService.Name
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: !Ref BatchWorkerDesiredCount
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopicArn
      OKActions:
        - !Ref AlertTopicArn

  ApiService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${AWS::StackName}-api'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApiTaskDefinition
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref ApiDesiredCount
      AvailabilityZoneRebalancing: ENABLED
      EnableECSManagedTags: true
      PropagateTags: TASK_DEFINITION
      HealthCheckGracePeriodSeconds: 180
      DeploymentController:
        Type: ECS
      DeploymentConfiguration:
        Strategy: BLUE_GREEN
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        BakeTimeInMinutes: 3
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        Alarms:
          AlarmNames:
            - !Ref Target5xxAlarm
          Enable: true
          Rollback: true
        LifecycleHooks: !If
          - DeploymentPauseEnabled
          - - TargetType: PAUSE
              LifecycleStages:
                - POST_TEST_TRAFFIC_SHIFT
              TimeoutConfiguration:
                TimeoutInMinutes: 30
                Action: ROLLBACK
          - !Ref AWS::NoValue
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !GetAtt TaskSecurityGroup.GroupId
          Subnets:
            - !Ref PublicSubnetAId
            - !Ref PublicSubnetBId
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn: !Ref BlueTargetGroup
          AdvancedConfiguration:
            AlternateTargetGroupArn: !Ref GreenTargetGroup
            ProductionListenerRule: !Ref ProductionListenerRule
            TestListenerRule: !Ref TestListenerRule
            RoleArn: !GetAtt EcsLoadBalancerInfrastructureRole.Arn

  SchedulerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${AWS::StackName}-scheduler'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref SchedulerTaskDefinition
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref SchedulerDesiredCount
      AvailabilityZoneRebalancing: DISABLED
      EnableECSManagedTags: true
      PropagateTags: TASK_DEFINITION
      DeploymentController:
        Type: ECS
      DeploymentConfiguration:
        Strategy: ROLLING
        MaximumPercent: 100
        MinimumHealthyPercent: 0
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !GetAtt TaskSecurityGroup.GroupId
          Subnets:
            - !Ref PublicSubnetAId
            - !Ref PublicSubnetBId

  ApiLiveTaskCountLowAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ApiServiceEnabled
    Properties:
      AlarmDescription: API live task count stayed below its desired count
      Namespace: AWS/ECS
      MetricName: LiveTaskCount
      Dimensions:
        - Name: ClusterName
          Value: !Ref Cluster
        - Name: ServiceName
          Value: !GetAtt ApiService.Name
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: !Ref ApiDesiredCount
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopicArn
      OKActions:
        - !Ref AlertTopicArn

  ApiMemoryHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ApiServiceEnabled
    Properties:
      AlarmDescription: API memory utilization above 85 percent for 5 minutes
      Namespace: AWS/ECS
      MetricName: MemoryUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref Cluster
        - Name: ServiceName
          Value: !GetAtt ApiService.Name
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 85
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopicArn
      OKActions:
        - !Ref AlertTopicArn

  SchedulerLiveTaskCountLowAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: SchedulerServiceEnabled
    Properties:
      AlarmDescription: Scheduler live task count stayed below its desired count
      Namespace: AWS/ECS
      MetricName: LiveTaskCount
      Dimensions:
        - Name: ClusterName
          Value: !Ref Cluster
        - Name: ServiceName
          Value: !GetAtt SchedulerService.Name
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: !Ref SchedulerDesiredCount
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopicArn
      OKActions:
        - !Ref AlertTopicArn

  SchedulerMemoryHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: SchedulerServiceEnabled
    Properties:
      AlarmDescription: Scheduler memory utilization above 85 percent for 5 minutes
      Namespace: AWS/ECS
      MetricName: MemoryUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref Cluster
        - Name: ServiceName
          Value: !GetAtt SchedulerService.Name
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 85
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopicArn
      OKActions:
        - !Ref AlertTopicArn

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubOidcSubject
      Policies:
        - PolicyName: PushImage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}'
        - PolicyName: DeployServices
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: elasticloadbalancing:DescribeTargetHealth
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                Resource: '*'
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub
                  - 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${ServiceName}-migration:*'
                  - ServiceName: !GetAtt ApiService.Name
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt Cluster.Arn
              - Effect: Allow
                Action: ecs:DescribeTasks
                Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${Cluster}/*'
              - Effect: Allow
                Action: ecs:ListTasks
                Resource: '*'
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt Cluster.Arn
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:ListServiceDeployments
                  - ecs:UpdateService
                Resource: !GetAtt ApiService.ServiceArn
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:UpdateService
                Resource:
                  - !GetAtt SchedulerService.ServiceArn
                  - !GetAtt BatchWorkerService.ServiceArn
              - Effect: Allow
                Action:
                  - ecs:ContinueServiceDeployment
                  - ecs:DescribeServiceDeployments
                  - ecs:StopServiceDeployment
                Resource:
                  - !GetAtt ApiService.ServiceArn
                  - !Sub
                    - 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service-deployment/${ClusterName}/${ServiceName}/*'
                    - ClusterName: !Ref Cluster
                      ServiceName: !GetAtt ApiService.Name
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt TaskRole.Arn
                  - !GetAtt BatchWorkerTaskRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

Outputs:
  ClusterName:
    Description: Workflow ECS_CLUSTER value.
    Value: !Ref Cluster
  ApiServiceName:
    Description: Workflow ECS_SERVICE value.
    Value: !GetAtt ApiService.Name
  ApiServiceArn:
    Value: !GetAtt ApiService.ServiceArn
  SchedulerServiceName:
    Description: Workflow ECS_SCHEDULER_SERVICE value.
    Value: !GetAtt SchedulerService.Name
  ApiTaskDefinitionArn:
    Value: !Ref ApiTaskDefinition
  EcrRepositoryName:
    Description: Workflow ECS_ECR_REPOSITORY value.
    Value: !Ref EcrRepositoryName
  ApiContainerName:
    Description: Workflow ECS_CONTAINER_NAME value.
    Value: api
  SchedulerContainerName:
    Description: Workflow ECS_SCHEDULER_CONTAINER_NAME value.
    Value: scheduler
  SchedulerTaskDefinitionArn:
    Value: !Ref SchedulerTaskDefinition
  BatchWorkerServiceName:
    Description: Workflow ECS_BATCH_WORKER_SERVICE value; keep desired count 0 until schema and configuration are ready.
    Value: !GetAtt BatchWorkerService.Name
  BatchWorkerContainerName:
    Description: Workflow ECS_BATCH_WORKER_CONTAINER_NAME value.
    Value: batch-worker
  BatchWorkerTaskDefinitionArn:
    Value: !Ref BatchWorkerTaskDefinition
  TaskQueueUrl:
    Description: Queue for durable TaskRun messages, not the analysis wake-up FIFO queue.
    Value: !Ref TaskQueue
  TaskQueueArn:
    Value: !GetAtt TaskQueue.Arn
  TaskDeadLetterQueueUrl:
    Value: !Ref TaskDeadLetterQueue
  TaskDeadLetterQueueArn:
    Value: !GetAtt TaskDeadLetterQueue.Arn
  TaskDeadLetterAlarmName:
    Value: !Ref TaskDeadLetterAlarm
  GitHubDeployRoleArn:
    Description: Set this output as the GitHub Actions variable ECS_AWS_ROLE_ARN.
    Value: !GetAtt GitHubDeployRole.Arn
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  ProductionUrl:
    Description: Production API URL after the external DNS record is switched; this stack creates no DNS record.
    Value: https://api.hiselectors.shop
  TestUrl:
    Description: Manual green listener check; allowed only from TestListenerIngressCidr.
    Value: !Sub 'http://${LoadBalancer.DNSName}:8080/actuator/health/readiness'
  ProductionListenerRuleArn:
    Value: !Ref ProductionListenerRule
  TestListenerRuleArn:
    Value: !Ref TestListenerRule
  BlueTargetGroupArn:
    Value: !Ref BlueTargetGroup
  GreenTargetGroupArn:
    Value: !Ref GreenTargetGroup
  DeploymentAlarmName:
    Value: !Ref Target5xxAlarm
  TaskSecurityGroupId:
    Value: !GetAtt TaskSecurityGroup.GroupId
  RuntimeDatabaseHost:
    Description: Endpoint injected into the API and scheduler task definitions as DB_HOST.
    Value: !Ref RuntimeDatabaseHost
  RuntimeDatabaseIdentifier:
    Description: External RDS DB instance monitored as the active runtime database.
    Value: !Ref RuntimeDatabaseIdentifier
  TestDatabaseSecurityGroupId:
    Description: Security group of the retained rollback database; it is not on the active runtime path.
    Value: !GetAtt TestDatabaseSecurityGroup.GroupId
  TestDatabaseIdentifier:
    Description: Retained rollback database identifier; it is not on the active runtime path.
    Value: !Ref TestDatabase
  TestDatabaseEndpoint:
    Description: Retained rollback database endpoint; it is not on the active runtime path.
    Value: !GetAtt TestDatabase.Endpoint.Address
  TestDatabasePort:
    Description: Retained rollback database port; it is not on the active runtime path.
    Value: !GetAtt TestDatabase.Endpoint.Port
