AWSTemplateFormatVersion: '2010-09-09'
Description: Isolated HiSelectors ECS/Fargate blue-green rehearsal stack

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing default VPC. The stack only references it.
  PublicSubnetAId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet with an internet-gateway route in the first AZ.
  PublicSubnetBId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet with an internet-gateway route in a different AZ.
  TestDbSnapshotIdentifier:
    Type: String
    MinLength: 1
    Description: ARN or identifier of the source RDS snapshot to restore. The source is not modified.
  TestDbSubnetGroupName:
    Type: String
    MinLength: 1
    Description: Existing DB subnet group in VpcId used only by the restored test DB.
  TestDbInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedPattern: '^db\.[a-z0-9]+\.[a-z0-9]+$'
  ImageUri:
    Type: String
    MinLength: 1
    Description: Existing ECR ARM64 image URI pinned to a git SHA or digest.
  EcrRepositoryName:
    Type: String
    Default: be-hiselectors
    AllowedPattern: '^[a-z0-9]+(?:[._/-][a-z0-9]+)*$'
    Description: Existing ECR repository. The stack does not modify it.
  RuntimeSecretArn:
    Type: String
    MinLength: 1
    Description: ARN of the Secrets Manager JSON secret containing credentials for the runtime database.
  RuntimeDatabaseHost:
    Type: String
    MinLength: 1
    Description: Endpoint hostname of the external database used by the API and scheduler tasks.
  RuntimeDatabasePort:
    Type: Number
    Default: 3306
    MinValue: 1
    MaxValue: 65535
    Description: Port of the external database used by the API and scheduler tasks.
  RuntimeDatabaseIdentifier:
    Type: String
    MinLength: 1
    Description: Existing RDS DB instance identifier monitored as the runtime database.
  GitHubOidcProviderArn:
    Type: String
    MinLength: 1
    Description: ARN of the existing GitHub Actions OIDC provider; it is referenced, not modified.
  GitHubOidcSubject:
    Type: String
    Default: repo:HD-Fuma@310806056/be-hiselectors@1324765193:ref:refs/heads/dev
    AllowedValues:
      - repo:HD-Fuma@310806056/be-hiselectors@1324765193:ref:refs/heads/dev
    Description: Exact repository and branch allowed to assume the new deploy role.
  AcmCertificateArn:
    Type: String
    MinLength: 1
    Description: ARN of the ap-northeast-2 ACM certificate for api.hiselectors.shop.
  AlertTopicArn:
    Type: String
    Default: arn:aws:sns:ap-northeast-2:167595589232:ec2-down-alerts
    Description: Existing SNS topic connected to the production Slack alert channel.
  BatchLogLambdaArn:
    Type: String
    Default: arn:aws:lambda:ap-northeast-2:167595589232:function:hiselectors-batch-log-to-slack
    Description: Existing Lambda that validates BATCH_EVENT application logs and publishes batch alerts.
  ProductionListenerIngressCidr:
    Type: String
    Default: 127.0.0.1/32
    AllowedPattern: '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$'
    Description: IPv4 CIDR allowed to call the HTTPS production listener and HTTP redirect.
  TestListenerIngressCidr:
    Type: String
    Default: 127.0.0.1/32
    AllowedPattern: '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$'
    Description: IPv4 CIDR allowed to call the isolated HTTP 8080 green test listener.
  ApiDesiredCount:
    Type: Number
    Default: 0
    AllowedValues:
      - 0
      - 2
    Description: Keep 0 for stack bootstrap; use 2 after the isolated database and stack are ready.
  SchedulerDesiredCount:
    Type: Number
    Default: 0
    AllowedValues:
      - 0
      - 1
    Description: Keep 0 for the isolated rehearsal; enable only after every other scheduler is stopped.
  EnableTaskQueuePublishing:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Enable API/scheduler queue publishing only after the queue schema and worker are verified.
  BatchWorkerDesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
    Description: Keep 0 for infrastructure preparation; start 1 verified worker before enabling publishers.
  BatchWorkerMailSecretArn:
    Type: String
    Default: ''
    Description: Optional SMTP secret containing MAIL_USERNAME and MAIL_PASSWORD; required for proposal email jobs.
  BatchWorkerSttBaseUrl:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https?://[^\s]+$'
    Description: Optional reachable STT/OCR worker URL supporting /content/reel; required for Instagram inspection jobs.

  EnableDeploymentPause:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable the POST_TEST_TRAFFIC_SHIFT approval hook only after the initial API service is healthy.

Conditions:
  DeploymentPauseEnabled: !Equals [!Ref EnableDeploymentPause, 'true']
  ApiServiceEnabled: !Equals [!Ref ApiDesiredCount, 2]
  SchedulerServiceEnabled: !Equals [!Ref SchedulerDesiredCount, 1]
  TaskQueuePublishingEnabled: !Equals [!Ref EnableTaskQueuePublishing, 'true']
  BatchWorkerServiceEnabled: !Equals [!Ref BatchWorkerDesiredCount, 1]
  BatchWorkerMailConfigured: !Not [!Equals [!Ref BatchWorkerMailSecretArn, '']]
  BatchWorkerSttConfigured: !Not [!Equals [!Ref BatchWorkerSttBaseUrl, '']]

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}'
      RetentionInDays: 30

  BatchLogInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BatchLogLambdaArn
      Action: lambda:InvokeFunction
      Principal: logs.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt LogGroup.Arn

  BatchLogSubscription:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: BatchLogInvokePermission
    Properties:
      LogGroupName: !Ref LogGroup
      FilterName: batch-events-to-slack
      FilterPattern: '"BATCH_EVENT"'
      DestinationArn: !Ref BatchLogLambdaArn
      Distribution: ByLogStream

  TaskDeadLetterQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub '${AWS::StackName}-task-runs-dlq'
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          - !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${AWS::StackName}-task-runs'

  TaskQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub '${AWS::StackName}-task-runs'
      SqsManagedSseEnabled: true
      VisibilityTimeout: 300
      ReceiveMessageWaitTimeSeconds: 20
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TaskDeadLetterQueue.Arn
        maxReceiveCount: 5

  TaskDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: TaskRun messages need investigation before controlled replay
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt TaskDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopicArn
      OKActions:
        - !Ref AlertTopicArn

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Policies:
        - PolicyName: ReadRuntimeSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref RuntimeSecretArn
              - !If
                - BatchWorkerMailConfigured
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref BatchWorkerMailSecretArn
                - !Ref AWS::NoValue

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:hiselectors-analysis.fifo'
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt TaskQueue.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: arn:aws:s3:::hiselectors-media/campaigns/*

  BatchWorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ConsumeTaskRuns
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                  # Follow-up jobs and recovery publish through the same durable TaskRun path.
                  - sqs:SendMessage
                Resource: !GetAtt TaskQueue.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt TaskDeadLetterQueue.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:hiselectors-analysis.fifo'

  EcsLoadBalancerInfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonECSInfrastructureRolePolicyForLoadBalancers'

  Cluster:
    Type: AWS::ECS::Cluster

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HiSelectors Fargate tasks; ingress is added only from the new ALB
      VpcId: !Ref VpcId

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HiSelectors rehearsal ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref ProductionListenerIngressCidr
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref ProductionListenerIngressCidr
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref TestListenerIngressCidr
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          DestinationSecurityGroupId: !GetAtt TaskSecurityGroup.GroupId

  TaskIngressFromLoadBalancer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt TaskSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !GetAtt LoadBalancerSecurityGroup.GroupId

  TestDatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Isolated snapshot-restored test database
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !GetAtt TaskSecurityGroup.GroupId

  AuditLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/rds/instance/${AWS::StackName}-test-db/audit'
      RetentionInDays: 30

  TestDatabase:
    Type: AWS::RDS::DBInstance
    DependsOn: AuditLogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DBInstanceIdentifier: !Sub '${AWS::StackName}-test-db'
      DBSnapshotIdentifier: !Ref TestDbSnapshotIdentifier
      DBInstanceClass: !Ref TestDbInstanceClass
      DBSubnetGroupName: !Ref TestDbSubnetGroupName
      VPCSecurityGroups:
        - !GetAtt TestDatabaseSecurityGroup.GroupId
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      EnableCloudwatchLogsExports:
        - audit
      DeletionProtection: true
      MaxAllocatedStorage: 1000
      Tags:
        - Key: Purpose
          Value: production-blue-green

  DatabaseConnectionsHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: RDS connections above 75 for 5 minutes
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref RuntimeDatabaseIdentifier
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 75
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopicArn
      OKActions:
        - !Ref AlertTopicArn

  DatabaseCpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: RDS CPU average above 90 percent for 5 minutes
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref RuntimeDatabaseIdentifier
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 90
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopicArn
      OKActions:
        - !Ref AlertTopicArn

  DatabaseMemoryLowAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: RDS freeable memory below 50 MiB for 15 minutes
      Namespace: AWS/RDS
      MetricName: FreeableMemory
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref RuntimeDatabaseIdentifier
      Statistic: Average
      Period: 60
      EvaluationPeriods: 15
      DatapointsToAlarm: 15
      Threshold: 52428800
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopicArn
      OKActions:
        - !Ref AlertTopicArn

  DatabaseStorageLowAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: RDS free storage below 2 GiB for 5 minutes
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref RuntimeDatabaseIdentifier
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopicArn
      OKActions:
        - !Ref AlertTopicArn

  DatabaseCriticalEventSubscription:
    Type: AWS::RDS::EventSubscription
    Properties:
      Enabled: true
      EventCategories:
        - availability
        - failure
        - low storage
      SnsTopicArn: !Ref AlertTopicArn
      SourceIds:
        - !Ref RuntimeDatabaseIdentifier
      SourceType: db-instance

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - !GetAtt LoadBalancerSecurityGroup.GroupId
      Subnets:
        - !Ref PublicSubnetAId
        - !Ref PublicSubnetBId

  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /actuator/health/readiness
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /actuator/health/readiness
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  ProductionListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref AcmCertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'

  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    DependsOn: ProductionListener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 8080
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'

  ProductionListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ProductionListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          Values:
            - '/*'
      Actions:
        - Type: forward
          ForwardConfig:
            TargetGroups:
              - TargetGroupArn: !Ref BlueTargetGroup
                Weight: 1
              - TargetGroupArn: !Ref GreenTargetGroup
                Weight: 0

  TestListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref TestListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          Values:
            - '/*'
      Actions:
        - Type: forward
          ForwardConfig:
            TargetGroups:
              - TargetGroupArn: !Ref BlueTargetGroup
                Weight: 1
              - TargetGroupArn: !Ref GreenTargetGroup
                Weight: 0

  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Roll back a deployment with repeated target 5xx responses
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopicArn
      OKActions:
        - !Ref AlertTopicArn

  LoadBalancer5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Alert on repeated 5xx responses generated by the load balancer
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopicArn
      OKActions:
        - !Ref AlertTopicArn

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-api'
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          StopTimeout: 60
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: prod
            - Name: SCHEDULING_ENABLED
              Value: 'false'
            # Omit these until cutover so infrastructure preparation preserves the old task definition.
            - !If
              - TaskQueuePublishingEnabled
              - Name: TASK_QUEUE_ENABLED
                Value: 'true'
              - !Ref AWS::NoValue
            - !If
              - TaskQueuePublishingEnabled
              - Name: TASK_QUEUE_WORKER_ENABLED
                Value: 'false'
              - !Ref AWS::NoValue
            - !If
              - TaskQueuePublishingEnabled
              - Name: TASK_QUEUE_URL
                Value: !Ref TaskQueue
              - !Ref AWS::NoValue
            - !If
              - TaskQueuePublishingEnabled
              - Name: TASK_QUEUE_DLQ_URL
                Value: !Ref TaskDeadLetterQueue
              - !Ref AWS::NoValue
            - Name: DISCOVERY_DEFAULTS_ENABLED
              Value: 'false'
            - Name: INSPECTION_POLICY_SYNC_ENABLED
              Value: 'false'
            - Name: SHOW_SQL
              Value: 'false'
            - Name: FORMAT_SQL
              Value: 'false'
            - Name: DB_POOL_MAX
              Value: '5'
            - Name: DB_POOL_MIN_IDLE
              Value: '1'
            - Name: DB_HOST
              Value: !Ref RuntimeDatabaseHost
            - Name: DB_PORT
              Value: !Ref RuntimeDatabasePort
            - Name: TZ
              Value: Asia/Seoul
            - Name: APPLICATION_CONTENT_ANALYSIS_SCHEDULER_ENABLED
              Value: 'false'
            - Name: APPLICATION_CONTENT_ANALYSIS_RUN_ONCE
              Value: 'false'
            - Name: GEMINI_MAX_OUTPUT_TOKENS
              Value: '65536'
          Secrets:
            - Name: DB_NAME
              ValueFrom: !Sub '${RuntimeSecretArn}:DB_NAME::'
            - Name: DB_USERNAME
              ValueFrom: !Sub '${RuntimeSecretArn}:DB_USERNAME::'
            - Name: DB_PASSWORD
              ValueFrom: !Sub '${RuntimeSecretArn}:DB_PASSWORD::'
            - Name: JWT_SECRET
              ValueFrom: !Sub '${RuntimeSecretArn}:JWT_SECRET::'
            - Name: INSTAGRAM_REDIRECT_URI
              ValueFrom: !Sub '${RuntimeSecretArn}:INSTAGRAM_REDIRECT_URI::'
            - Name: GEMINI_API_KEY
              ValueFrom: !Sub '${RuntimeSecretArn}:GEMINI_API_KEY::'
            - Name: GEMINI_API_KEYS
              ValueFrom: !Sub '${RuntimeSecretArn}:GEMINI_API_KEYS::'
            - Name: META_API_VERSION
              ValueFrom: !Sub '${RuntimeSecretArn}:META_API_VERSION::'
            - Name: META_INSTAGRAM_BUSINESS_ACCOUNT_ID
              ValueFrom: !Sub '${RuntimeSecretArn}:META_INSTAGRAM_BUSINESS_ACCOUNT_ID::'
            - Name: META_LONG_LIVED_ACCESS_TOKEN
              ValueFrom: !Sub '${RuntimeSecretArn}:META_LONG_LIVED_ACCESS_TOKEN::'
            - Name: APPLICATION_CONTENT_ANALYSIS_QUEUE_URL
              ValueFrom: !Sub '${RuntimeSecretArn}:APPLICATION_CONTENT_ANALYSIS_QUEUE_URL::'
            - Name: GEMINI_FALLBACK_MODELS
              ValueFrom: !Sub '${RuntimeSecretArn}:GEMINI_FALLBACK_MODELS::'
            - Name: GEMINI_MODEL
              ValueFrom: !Sub '${RuntimeSecretArn}:GEMINI_MODEL::'
            - Name: GOOGLE_CLIENT_ID
              ValueFrom: !Sub '${RuntimeSecretArn}:GOOGLE_CLIENT_ID::'
            - Name: GOOGLE_CLIENT_SECRET
              ValueFrom: !Sub '${RuntimeSecretArn}:GOOGLE_CLIENT_SECRET::'
            - Name: INSTAGRAM_CLIENT_ID
              ValueFrom: !Sub '${RuntimeSecretArn}:INSTAGRAM_CLIENT_ID::'
            - Name: INSTAGRAM_CLIENT_SECRET
              ValueFrom: !Sub '${RuntimeSecretArn}:INSTAGRAM_CLIENT_SECRET::'
            - Name: KAKAO_CLIENT_SECRET
              ValueFrom: !Sub '${RuntimeSecretArn}:KAKAO_CLIENT_SECRET::'
            - Name: KAKAO_MESSAGE_DEFAULT_RECIPIENT_UUID
              ValueFrom: !Sub '${RuntimeSecretArn}:KAKAO_MESSAGE_DEFAULT_RECIPIENT_UUID::'
            - Name: KAKAO_MESSAGE_MOBILE_WEB_URL
              ValueFrom: !Sub '${RuntimeSecretArn}:KAKAO_MESSAGE_MOBILE_WEB_URL::'
            - Name: KAKAO_MESSAGE_WEB_URL
              ValueFrom: !Sub '${RuntimeSecretArn}:KAKAO_MESSAGE_WEB_URL::'
            - Name: KAKAO_REDIRECT_URI
              ValueFrom: !Sub '${RuntimeSecretArn}:KAKAO_REDIRECT_URI::'
            - Name: KAKAO_REST_API_KEY
              ValueFrom: !Sub '${RuntimeSecretArn}:KAKAO_REST_API_KEY::'
            - Name: KAKAO_TOKEN_ENCRYPTION_KEY
              ValueFrom: !Sub '${RuntimeSecretArn}:KAKAO_TOKEN_ENCRYPTION_KEY::'
            - Name: MEDIA_PUBLIC_BASE_URL
              ValueFrom: !Sub '${RuntimeSecretArn}:MEDIA_PUBLIC_BASE_URL::'
