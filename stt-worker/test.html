<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정성 엔진 테스트</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            max-width: 820px; margin: 0 auto; padding: 24px; line-height: 1.5;
        }
        h1 { font-size: 1.4rem; margin-bottom: 4px; }
        .sub { opacity: .65; font-size: .85rem; margin-bottom: 20px; }
        label { display: block; font-size: .8rem; opacity: .8; margin-bottom: 4px; }
        textarea {
            width: 100%; min-height: 160px; padding: 12px; font-size: .95rem;
            border: 1px solid #8886; border-radius: 10px; background: transparent;
            color: inherit; font-family: inherit; resize: vertical;
        }
        .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
        button.go {
            padding: 9px 18px; font-size: 1rem; border: 0; border-radius: 8px;
            background: #4f46e5; color: #fff; cursor: pointer;
        }
        button.go:disabled { opacity: .5; cursor: default; }
        .sample { background: none; border: 0; color: #6366f1; cursor: pointer;
            font-size: .85rem; }
        .meta { font-size: .8rem; opacity: .7; margin: 16px 0 4px; }
        .err {
            color: #dc2626; border: 1px solid #dc262688; border-radius: 10px;
            padding: 12px; margin-top: 14px; display: none;
        }
        .grid { display: grid; gap: 14px; margin-top: 16px; }
        .card { border: 1px solid #8884; border-radius: 12px; padding: 14px;
            background: #8881; }
        .card h3 { margin: 0 0 8px; font-size: .82rem; opacity: .8;
            text-transform: uppercase; letter-spacing: .03em; }
        .big { font-size: 1.15rem; font-weight: 600; }
        .score { font-size: .8rem; opacity: .6; margin-left: 6px; font-weight: 400; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { padding: 4px 10px; border-radius: 999px; background: #6366f133;
            font-size: .85rem; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 999px;
            font-size: .72rem; font-weight: 600; margin-left: 8px; }
        .badge.warn { background: #f59e0b33; color: #b45309; }
        .badge.ok { background: #10b98133; color: #047857; }
        .badge.risk { background: #dc262633; color: #b91c1c; }
        .hits { font-size: .82rem; opacity: .8; margin-top: 6px; }
    </style>
</head>
<body>
    <h1>정성 엔진 테스트</h1>
    <div class="sub">transcript 붙여넣으면 로컬 필드 추출(키워드·카테고리·위험). LLM 안 씀.
        스타일·톤·요약·강점은 LLM 계층 담당이라 여기 없음.</div>

    <label for="txt">Transcript 텍스트</label>
    <textarea id="txt" placeholder="유튜브 STT 결과(음성/자막)를 붙여넣으세요."></textarea>
    <div class="row">
        <button class="go" id="go">분석</button>
        <button class="sample" id="sample">샘플 채우기</button>
        <span class="meta" id="meta"></span>
    </div>
    <div class="err" id="err"></div>

    <div class="grid" id="out" style="display:none">
        <div class="card">
            <h3>카테고리 <span style="opacity:.5;text-transform:none">(더현대Hi 공식 코드)</span></h3>
            <div><span class="big" id="cat"></span><span class="score" id="catScore"></span>
                <span id="catBadge"></span></div>
        </div>
        <div class="card">
            <h3>욕설·혐오 <span style="opacity:.5;text-transform:none">(kor_unsmile 스크리닝 · 의심만 표시, 확정은 LLM)</span></h3>
            <div><span class="big" id="risk"></span><span id="riskBadge"></span></div>
            <div class="hits" id="riskHits"></div>
        </div>
        <div class="card">
            <h3>키워드</h3>
            <div class="chips" id="kw"></div>
        </div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        const btn = $("go"), meta = $("meta"), err = $("err"), out = $("out");
        const SAMPLE = "오늘은 신상 쿠션 파운데이션 발색이랑 지속력을 리뷰해볼게요. "
            + "언박싱부터 실사용까지 꼼꼼하게 보여드릴게요. 커버력도 테스트해봤어요.";

        function badge(el, uncertain) {
            el.className = "badge " + (uncertain ? "warn" : "ok");
            el.textContent = uncertain ? "저신뢰 → LLM 폴백" : "확실";
        }

        async function run() {
            const text = $("txt").value.trim();
            if (!text) { showErr("텍스트를 입력하세요."); return; }
            btn.disabled = true; err.style.display = "none"; out.style.display = "none";
            meta.textContent = "분석 중…";
            const t0 = performance.now();
            try {
                const res = await fetch("/analyze", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text, include_hate: true })  // 테스트 화면은 욕설혐오도 확인
                });
                const d = await res.json();
                if (!res.ok) throw new Error(d.detail || ("HTTP " + res.status));
                meta.textContent = ((performance.now() - t0) / 1000).toFixed(2) + "초";

                $("cat").textContent = d.category.label || "(해당없음)";
                $("catScore").textContent = d.category.score;
                badge($("catBadge"), d.category.uncertain);

                const rb = $("riskBadge");
                const hate = d.hate || { suspected: false, labels: [], scores: {} };
                if (hate.suspected) {
                    $("risk").textContent = hate.labels.join(", ");
                    rb.className = "badge warn"; rb.textContent = "의심 → LLM 확인 필요";
                    $("riskHits").textContent = "모델 점수(확정 아님): " + JSON.stringify(hate.scores);
                } else {
                    $("risk").textContent = "없음";
                    rb.className = "badge ok"; rb.textContent = "깨끗";
                    $("riskHits").textContent = "";
                }

                const kw = $("kw"); kw.innerHTML = "";
                (d.keywords || []).forEach(k => {
                    const s = document.createElement("span");
                    s.className = "chip"; s.textContent = k; kw.appendChild(s);
                });
                out.style.display = "grid";
            } catch (e) {
                meta.textContent = "실패"; showErr("요청 실패: " + e.message);
            } finally { btn.disabled = false; }
        }

        function showErr(m) { err.textContent = m; err.style.display = "block"; }
        btn.addEventListener("click", run);
        $("sample").addEventListener("click", () => { $("txt").value = SAMPLE; });
    </script>
</body>
</html>
